<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>

<style>

*{
  margin: 0px;
  padding: 0px;
  box-sizing: border-box;
}

    .container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    justify-content: center;
  }

  .container img {
    width: 200px;
    height: 150px;
    border-radius: 10px;
    object-fit: contain;
  }

  #pricing-card1 {
    background-color: red;
    border: 1px solid;
    flex-direction: column;
    display: flex;
    /* justify-content: center; */
    align-items: center;
    transition: 0.3s;
  }

    #pricing-card1:hover {
    box-shadow: 5px 5px 10px black;
    transform: scale(1.05);
  }

  div button {
    border: none;
    border-radius: 50%;
    padding: 15px;
    background-color: bisque;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    transform: scale(1.2);
  }

</style>

<body>
  <div class="container">

    <div id="pricing-card1">
      <img src="https://m.media-amazon.com/images/I/61h2UCYI4qL._AC_UL480_FMwebp_QL65_.jpg" alt="shoes" />

      <h1>Nike Shoes</h1>
      <h2>⭐ 4.5</h2>
      <h2>₹2,999</h2>

      <button>Add Cart</button>
    </div>
  </div>
</body>
</html>
